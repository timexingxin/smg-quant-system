<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" height="100%">
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0969da"/>
    </marker>
    <style>
      .node-rect { fill: #ffffff; stroke: #24292f; stroke-width: 1.2; rx: 4px; }
      .container-rect { fill: #f6f8fa; stroke: #24292f; stroke-width: 1.2; rx: 6px; }
      .sub-rect { fill: #ffffff; stroke: #24292f; stroke-width: 1.1; rx: 4px; }
      .label-rect { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; rx: 4px; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #24292f; text-anchor: middle; dominant-baseline: central; }
      .container-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #24292f; letter-spacing: 0.2px; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #24292f; text-anchor: middle; dominant-baseline: central; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #57606a; text-anchor: middle; dominant-baseline: central; }
      .flow-line { stroke: #0969da; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="920" height="560" rx="12" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>

  <!-- Top Flow: Candidate Universe -> Rule Engine -> Screening Pool -->
  <!-- 1. Candidate Stock Universe -->
  <rect class="node-rect" x="310" y="30" width="300" height="38"/>
  <text class="node-text" x="460" y="49">Candidate Stock Universe (NASDAQ / NYSE)</text>

  <!-- Arrow 1 -> 2 -->
  <line class="flow-line" x1="460" y1="68" x2="460" y2="98" marker-end="url(#blue-arrow)"/>

  <!-- 2. Module 1: Official Rule Filters & Multi-Factor Scoring -->
  <rect class="node-rect" x="270" y="98" width="380" height="38"/>
  <text class="node-text" x="460" y="117">Module 1: Official Rule Filters &amp; Multi-Factor Scoring</text>

  <!-- Arrow 2 -> 3 -->
  <line class="flow-line" x1="460" y1="136" x2="460" y2="166" marker-end="url(#blue-arrow)"/>

  <!-- 3. Screened Buy Candidate Pool -->
  <rect class="node-rect" x="340" y="166" width="240" height="38"/>
  <text class="node-text" x="460" y="185">Screened Buy Candidate Pool</text>

  <!-- Arrow 3 -> 4 Container -->
  <line class="flow-line" x1="460" y1="204" x2="460" y2="234" marker-end="url(#blue-arrow)"/>

  <!-- 4. 4-Pillar Quantitative Synthesis Engine Container -->
  <rect class="container-rect" x="45" y="234" width="830" height="84"/>
  <text class="container-title" x="58" y="252">4-Pillar Quantitative Synthesis Engine</text>
  <line x1="45" y1="260" x2="875" y2="260" stroke="#d0d7de" stroke-width="1"/>

  <!-- 4 Sub-Boxes -->
  <rect class="sub-rect" x="58" y="268" width="205" height="38"/>
  <text class="sub-text" x="160.5" y="287">Technical Indicators (EMA/RSI/MACD/ATR)</text>

  <rect class="sub-rect" x="273" y="268" width="165" height="38"/>
  <text class="sub-text" x="355.5" y="287">Multi-Stage DCF Valuation</text>

  <rect class="sub-rect" x="448" y="268" width="185" height="38"/>
  <text class="sub-text" x="540.5" y="287">100k-Path Monte Carlo VaR</text>

  <rect class="sub-rect" x="643" y="268" width="220" height="38"/>
  <text class="sub-text" x="753" y="287">Kelly Sizing &amp; Correlation Matrix</text>

  <!-- Bottom Flow -->
  <!-- Arrow Container -> Module 3 -->
  <line class="flow-line" x1="460" y1="318" x2="460" y2="350" marker-end="url(#blue-arrow)"/>

  <!-- Module 3 -->
  <rect class="node-rect" x="285" y="350" width="350" height="38"/>
  <text class="node-text" x="460" y="369">Module 3: Drawdown State Machine &amp; Position Sizing</text>

  <!-- Arrow Module 3 -> Module 4 -->
  <line class="flow-line" x1="460" y1="388" x2="460" y2="420" marker-end="url(#blue-arrow)"/>

  <!-- Module 4 -->
  <rect class="node-rect" x="275" y="420" width="370" height="38"/>
  <text class="node-text" x="460" y="439">Module 4: 9-State Order Machine &amp; Pre-Trade Risk Gates</text>

  <!-- Module 5 (Real-Time Risk Patrol Daemon) -->
  <rect class="node-rect" x="640" y="350" width="260" height="38"/>
  <text class="node-text" x="770" y="369">Module 5: 0.5s Real-Time Risk Patrol Daemon</text>

  <!-- Final Trade Execution -->
  <rect class="node-rect" x="680" y="488" width="180" height="38"/>
  <text class="node-text" x="770" y="507">Final Trade Execution</text>

  <!-- Arrow: Module 4 -> Final Trade Execution -->
  <path class="flow-line" d="M 645 439 L 740 439 L 740 488" marker-end="url(#blue-arrow)"/>

  <!-- Arrow: Module 5 -> Final Trade Execution (Trigger liquidation/trim) -->
  <line class="flow-line" x1="765" y1="388" x2="765" y2="488" marker-end="url(#blue-arrow)"/>

  <!-- Trigger Condition Floating Tag -->
  <rect class="label-rect" x="620" y="426" width="280" height="26"/>
  <text class="tag-text" x="760" y="439">Triggers: GAES -6% / 5% Trailing Stop / Cap Exceeded</text>

  <!-- Arrow: Final Trade Execution -> Module 5 (Continuous upward surveillance loop) -->
  <line class="flow-line" x1="800" y1="488" x2="800" y2="394" marker-end="url(#blue-arrow)"/>
</svg>