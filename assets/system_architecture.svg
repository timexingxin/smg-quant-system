<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" height="100%">
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0969da"/>
    </marker>
    <style>
      .node-rect { fill: #ffffff; stroke: #24292f; stroke-width: 1.2; }
      .container-rect { fill: #f6f8fa; stroke: #24292f; stroke-width: 1.2; }
      .sub-rect { fill: #ffffff; stroke: #24292f; stroke-width: 1.1; }
      .label-rect { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; rx: 4px; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #24292f; text-anchor: middle; dominant-baseline: central; }
      .container-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 600; fill: #24292f; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 11.5px; fill: #24292f; text-anchor: middle; dominant-baseline: central; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 10.5px; fill: #57606a; text-anchor: middle; dominant-baseline: central; }
      .flow-line { stroke: #0969da; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="920" height="560" rx="12" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>

  <!-- Top Flow: Candidate Universe -> Rule Engine -> Screening Pool -->
  <!-- 1. 候选股票池 -->
  <rect class="node-rect" x="350" y="30" width="220" height="38"/>
  <text class="node-text" x="460" y="49">候选股票池 (NASDAQ / NYSE)</text>

  <!-- Arrow 1 -> 2 -->
  <line class="flow-line" x1="460" y1="68" x2="460" y2="98" marker-end="url(#blue-arrow)"/>

  <!-- 2. 模块 1 -->
  <rect class="node-rect" x="320" y="98" width="280" height="38"/>
  <text class="node-text" x="460" y="117">模块 1: 官方规则硬过滤 &amp; 多因子初筛评分</text>

  <!-- Arrow 2 -> 3 -->
  <line class="flow-line" x1="460" y1="136" x2="460" y2="166" marker-end="url(#blue-arrow)"/>

  <!-- 3. Buy Candidates 优选池 -->
  <rect class="node-rect" x="365" y="166" width="190" height="38"/>
  <text class="node-text" x="460" y="185">Buy Candidates 优选池</text>

  <!-- Arrow 3 -> 4 Container -->
  <line class="flow-line" x1="460" y1="204" x2="460" y2="234" marker-end="url(#blue-arrow)"/>

  <!-- 4. 四模型量化融合 Container -->
  <rect class="container-rect" x="45" y="234" width="830" height="84"/>
  <text class="container-title" x="58" y="252">四模型量化融合</text>
  <line x1="45" y1="260" x2="875" y2="260" stroke="#d0d7de" stroke-width="1"/>

  <!-- 4 Sub-Boxes -->
  <rect class="sub-rect" x="58" y="268" width="185" height="38"/>
  <text class="sub-text" x="150" y="287">全套技术指标套件 (EMA/RSI/MACD/ATR)</text>

  <rect class="sub-rect" x="253" y="268" width="145" height="38"/>
  <text class="sub-text" x="325" y="287">DCF 内在价值模型</text>

  <rect class="sub-rect" x="408" y="268" width="185" height="38"/>
  <text class="sub-text" x="500" y="287">100k 路径 GBM 蒙特卡洛 VaR</text>

  <rect class="sub-rect" x="603" y="268" width="260" height="38"/>
  <text class="sub-text" x="733" y="287">Kelly 最优化仓位求解 &amp; 相关性矩阵</text>

  <!-- Bottom Flow -->
  <!-- Arrow Container -> 模块 3 -->
  <line class="flow-line" x1="460" y1="318" x2="460" y2="350" marker-end="url(#blue-arrow)"/>

  <!-- 模块 3 -->
  <rect class="node-rect" x="340" y="350" width="240" height="38"/>
  <text class="node-text" x="460" y="369">模块 3: 回撤状态机与仓位尺寸分配</text>

  <!-- Arrow 模块 3 -> 模块 4 -->
  <line class="flow-line" x1="460" y1="388" x2="460" y2="420" marker-end="url(#blue-arrow)"/>

  <!-- 模块 4 -->
  <rect class="node-rect" x="330" y="420" width="260" height="38"/>
  <text class="node-text" x="460" y="439">模块 4: 订单 9 态状态机与前置风控拦截</text>

  <!-- 模块 5 (常驻风控) -->
  <rect class="node-rect" x="640" y="350" width="230" height="38"/>
  <text class="node-text" x="755" y="369">模块 5: 0.5s 常驻高频风控守护进程</text>

  <!-- 最终交易执行 -->
  <rect class="node-rect" x="665" y="488" width="140" height="38"/>
  <text class="node-text" x="735" y="507">最终交易执行</text>

  <!-- Arrow: 模块 4 -> 最终交易执行 (L型折线) -->
  <path class="flow-line" d="M 590 439 L 710 439 L 710 488" marker-end="url(#blue-arrow)"/>

  <!-- Arrow: 模块 5 -> 最终交易执行 (向下触发) -->
  <line class="flow-line" x1="735" y1="388" x2="735" y2="488" marker-end="url(#blue-arrow)"/>

  <!-- 触发条件浮层标签 -->
  <rect class="label-rect" x="605" y="426" width="230" height="26"/>
  <text class="tag-text" x="720" y="439">触发 GAES -6% / 5% Trailing Stop / 集中度超限</text>

  <!-- Arrow: 最终交易执行 -> 模块 5 (向上监听守护闭环) -->
  <line class="flow-line" x1="775" y1="488" x2="775" y2="394" marker-end="url(#blue-arrow)"/>
</svg>