[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smg-quant-system"
version = "0.2.0"
description = "Educational quantitative research and risk-management system designed for the Stock Market Game simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TimeXingXin", email = "212788477+timexingxin@users.noreply.github.com" }
]
keywords = ["quantitative-finance", "stock-market-game", "risk-management", "backtesting", "monte-carlo", "kelly-criterion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "yfinance>=0.2.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
smg-cli = "strategy_cli:main"

[tool.setuptools]
py-modules = ["strategy_cli"]

[tool.setuptools.packages.find]
where = ["src"]

