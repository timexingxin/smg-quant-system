name: CI

on:
  push:
    branches: [ main, hardening/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Validate CLI and module imports
        run: |
          python -c "import smg_strategy; print('smg_strategy imported successfully')"
          python strategy_cli.py --help

      - name: Run isolated test suite
        env:
          SMG_DISABLE_FILE_LOG: "1"
        run: |
          python -m unittest discover -s tests -v
